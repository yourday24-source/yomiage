<style>
:root{
  --ink:#1D2B4A; --paper:#F2F4F7; --sheet:#FFFFFF; --line:#D5DAE3;
  --muted:#5E6A80; --mark:#FFE36E; --markInk:#1D2B4A; --btn:#1D2B4A; --btnInk:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E6EAF2; --paper:#121826; --sheet:#1A2233; --line:#2C3650;
    --muted:#98A3B8; --mark:#F2D34F; --markInk:#121826; --btn:#E6EAF2; --btnInk:#121826;
  }
}
:root[data-theme="dark"]{
  --ink:#E6EAF2; --paper:#121826; --sheet:#1A2233; --line:#2C3650;
  --muted:#98A3B8; --mark:#F2D34F; --markInk:#121826; --btn:#E6EAF2; --btnInk:#121826;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  font-size:17px;line-height:1.9;
}
main{max-width:46rem;margin:0 auto;padding:1.25rem 1rem 9rem}
header{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:.9rem}
h1{font-size:1.35rem;font-weight:700;margin:0;letter-spacing:.04em}
.count{color:var(--muted);font-size:.85rem}

.sheet{
  background:var(--sheet);border:1px solid var(--line);border-radius:14px;
  min-height:55vh;position:relative;
}
textarea{
  display:block;width:100%;min-height:55vh;border:0;resize:vertical;background:transparent;
  color:var(--ink);font:inherit;line-height:1.9;padding:1.2rem 1.3rem;border-radius:14px;
}
textarea:focus{outline:none}
.sheet:focus-within{border-color:var(--ink)}
textarea::placeholder{color:var(--muted)}

#reader{padding:1.2rem 1.3rem;white-space:pre-wrap;word-break:break-word}
#reader[hidden]{display:none}
.s{cursor:pointer;border-radius:4px;transition:background-color .15s}
.s:hover{background:color-mix(in srgb,var(--mark) 35%,transparent)}
.s.now{background:var(--mark);color:var(--markInk);box-shadow:0 0 0 2px var(--mark)}
.s.done{color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem;margin:.6rem .2rem 0}

.bar{
  position:fixed;left:0;right:0;bottom:0;
  padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom,0px));
  background:var(--sheet);border-top:1px solid var(--line);
}
.bar-in{max-width:46rem;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
button,select{
  font:inherit;font-size:.95rem;color:var(--ink);background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:.45rem .95rem;cursor:pointer;
}
button:hover{border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,.s:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#play{
  background:var(--btn);color:var(--btnInk);border-color:var(--btn);
  font-weight:700;min-width:6.5rem;padding:.55rem 1.2rem;font-size:1rem;
}
.speed{display:flex;align-items:center;gap:.4rem;font-size:.9rem;color:var(--muted)}
.speed input{width:7rem;accent-color:var(--ink)}
.speed output{min-width:2.6rem;color:var(--ink);font-variant-numeric:tabular-nums}
select{max-width:13rem;border-radius:10px}
.spacer{flex:1}
#msg{width:100%;font-size:.85rem;color:var(--muted);margin:0;min-height:1.2em}
@media (max-width:560px){
  .speed input{width:5.5rem}
  select{max-width:100%;flex:1 1 100%}
  .spacer{display:none}
}
@media (prefers-reduced-motion:reduce){.s{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>読み上げ</h1>
    <span class="count" id="count">0文字</span>
  </header>

  <div class="sheet">
    <textarea id="text" placeholder="ここに文章を貼り付けて「再生」を押してください。&#10;下の「貼り付け」ボタンでコピーした文章をそのまま入れられます。"></textarea>
    <div id="reader" hidden></div>
  </div>
  <p class="hint" id="hint">再生中は、文をタップするとそこから読み直します。</p>
</main>

<div class="bar">
  <div class="bar-in">
    <button id="paste" type="button">貼り付け</button>
    <button id="clear" type="button">全部消す</button>
    <button id="play" type="button">再生</button>
    <button id="stop" type="button" disabled>停止</button>
    <label class="speed">速さ
      <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1">
      <output id="rateOut">1.0倍</output>
    </label>
    <span class="spacer"></span>
    <select id="voice" aria-label="声の種類"></select>
    <p id="msg" role="status"></p>
  </div>
</div>

<script>
(function(){
  var synth = window.speechSynthesis;
  var $ = function(id){ return document.getElementById(id); };
  var textEl=$('text'), reader=$('reader'), playBtn=$('play'), stopBtn=$('stop'),
      pasteBtn=$('paste'), clearBtn=$('clear'), rateEl=$('rate'), rateOut=$('rateOut'), voiceSel=$('voice'),
      msg=$('msg'), countEl=$('count');

  var sentences=[], idx=0, state='idle', voices=[], token=0;

  function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

  if(!synth || typeof SpeechSynthesisUtterance==='undefined'){
    msg.textContent='このブラウザは読み上げに対応していません。Chrome・Safari・Edgeで開いてください。';
    playBtn.disabled=true;
  }

  // 保存していた設定と下書きを戻す
  var savedRate=load('yomi-rate'); if(savedRate){ rateEl.value=savedRate; }
  var savedText=load('yomi-text'); if(savedText){ textEl.value=savedText; }
  function showRate(){ rateOut.textContent=Number(rateEl.value).toFixed(1)+'倍'; }
  function showCount(){ countEl.textContent=textEl.value.replace(/\s/g,'').length.toLocaleString()+'文字'; }
  showRate(); showCount();

  textEl.addEventListener('input',function(){ showCount(); store('yomi-text',textEl.value); });
  rateEl.addEventListener('input',function(){
    showRate(); store('yomi-rate',rateEl.value);
    if(state==='playing'){ speakFrom(idx); } // 速さを変えたら今の文から読み直す
  });

  // 声の一覧（日本語を優先。Macで鳴らないことがある声は後ろへ）
  var quirky=/Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Bad News|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Albert|Bahh|Fred|Junior|Kathy|Ralph/i;
  function score(v){
    var s=0;
    if(/^ja/i.test(v.lang)) s+=100;
    if(/Kyoko/i.test(v.name)) s+=50;
    else if(/Otoya|O-Ren|Hattori/i.test(v.name)) s+=40;
    if(v.localService) s+=10;
    if(quirky.test(v.name)) s-=80;
    return s;
  }
  function loadVoices(){
    if(!synth) return;
    voices=synth.getVoices();
    if(!voices.length) return;
    var list=voices.slice().sort(function(a,b){ return score(b)-score(a); });
    var saved=load('yomi-voice2');
    voiceSel.innerHTML='';
    list.forEach(function(v){
      var o=document.createElement('option');
      o.value=v.name; o.textContent=v.name+(/^ja/i.test(v.lang)?'':'（'+v.lang+'）');
      voiceSel.appendChild(o);
    });
    if(saved && list.some(function(v){return v.name===saved;})) voiceSel.value=saved;
    else voiceSel.value=list[0].name;
  }
  loadVoices();
  if(synth && 'onvoiceschanged' in synth) synth.onvoiceschanged=loadVoices;
  voiceSel.addEventListener('change',function(){
    store('yomi-voice2',voiceSel.value);
    if(state==='playing'){ speakFrom(idx); }
  });

  // 声が出なかったとき、次の候補の声に自動で切り替える
  function tryNextVoice(){
    var opts=[].slice.call(voiceSel.options);
    var k=voiceSel.selectedIndex;
    for(var j=k+1;j<opts.length;j++){
      var v=voices.find(function(x){return x.name===opts[j].value;});
      if(v && /^ja/i.test(v.lang) && !quirky.test(v.name)){ voiceSel.selectedIndex=j; return true; }
    }
    return false;
  }

  // 文ごとに区切る（長すぎる文は読点でさらに分ける）
  function split(text){
    var parts=text.match(/[^。．！？!?\n]+[。．！？!?」』）)]*|\n+/g)||[];
    var out=[];
    parts.forEach(function(p){
      if(/^\n+$/.test(p)){ out.push({t:p,speak:false}); return; }
      if(p.length<=100){ out.push({t:p,speak:!!p.trim()}); return; }
      var sub=p.match(/[^、，,]+[、，,]?/g)||[p], buf='';
      sub.forEach(function(s){
        if((buf+s).length>100 && buf){ out.push({t:buf,speak:true}); buf=''; }
        buf+=s;
      });
      if(buf) out.push({t:buf,speak:!!buf.trim()});
    });
    return out;
  }

  function buildReader(){
    reader.innerHTML='';
    sentences.forEach(function(s,i){
      if(!s.speak){ reader.appendChild(document.createTextNode(s.t)); return; }
      var span=document.createElement('span');
      span.className='s'; span.textContent=s.t; span.dataset.i=i; span.tabIndex=0;
      span.addEventListener('click',function(){ speakFrom(i); });
      span.addEventListener('keydown',function(e){ if(e.key==='Enter'){ speakFrom(i); } });
      s.el=span; reader.appendChild(span);
    });
  }

  function mark(i){
    sentences.forEach(function(s,j){
      if(!s.el) return;
      s.el.classList.toggle('now',j===i);
      s.el.classList.toggle('done',j<i);
    });
    var cur=sentences[i]&&sentences[i].el;
    if(cur){
      var r=cur.getBoundingClientRect();
      if(r.top<80||r.bottom>window.innerHeight-140){
        cur.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
      }
    }
  }

  function nextSpeakable(i){
    while(i<sentences.length && !sentences[i].speak) i++;
    return i;
  }

  // 1文ずつ順番に読む
  // ・読み上げ中の文をしっかり持っておく（持っていないと「読み終わり」の合図が消えることがある）
  // ・見張り役：合図が来なくても、声が止まっていたら次の文へ進む
  var current=null, watch=null, startedAt=0, retries=0;

  function clearWatch(){ if(watch){ clearInterval(watch); watch=null; } }

  function speakFrom(i, isRetry){
    token++; var my=token;
    clearWatch();
    synth.cancel();
    i=nextSpeakable(i);
    if(i>=sentences.length){ finish(); return; }
    if(!isRetry) retries=0;
    idx=i; setState('playing'); mark(i);

    var u=new SpeechSynthesisUtterance(sentences[i].t);
    u.lang='ja-JP';
    u.rate=Number(rateEl.value);
    var v=voices.find(function(x){return x.name===voiceSel.value;});
    if(v){ u.voice=v; u.lang=v.lang; }
    current=u;

    var done=false, heard=false;
    function next(){
      if(done || my!==token || state!=='playing') return;
      done=true; clearWatch(); speakFrom(i+1);
    }
    u.onstart=function(){ heard=true; };
    u.onend=next;
    u.onerror=function(e){
      if(my!==token || done) return;
      if(e.error==='interrupted'||e.error==='canceled') return;
      done=true; clearWatch();
      if(retries<2){ retries++; setTimeout(function(){ if(my===token) speakFrom(i,true); },300); return; }
      msg.textContent='読み上げが止まりました。「続きから」を押すと、この文から読み直します。';
      setState('paused');
    };

    // 取り消し直後にすぐ話させると無視されることがあるので、少し間をあける
    setTimeout(function(){
      if(my!==token) return;
      try{ synth.resume(); }catch(e){}
      synth.speak(u);
      startedAt=Date.now();
      watch=setInterval(function(){
        if(my!==token || done){ clearWatch(); return; }
        var quiet=!synth.speaking && !synth.pending;
        var elapsed=Date.now()-startedAt;
        if(quiet && elapsed>1200){
          if(heard){ next(); }                 // 読み終わったのに合図が来なかった → 次へ
          else if(retries<2){ retries++; done=true; clearWatch(); speakFrom(i,true); } // 始まらなかった → やり直し
          else if(tryNextVoice()){ done=true; clearWatch(); speakFrom(i); msg.textContent='声が出なかったので「'+voiceSel.value+'」に切り替えました。'; }
          else { done=true; clearWatch(); msg.textContent='声が出ませんでした。Macの音量と、システム設定の「読み上げコンテンツ」で日本語の声が入っているか確認してください。'; setState('paused'); }
        }
      },500);
    },120);
  }

  function setState(s){
    state=s;
    playBtn.textContent = s==='playing' ? '一時停止' : (s==='paused' ? '続きから' : '再生');
    stopBtn.disabled = s==='idle';
    textEl.hidden = s!=='idle';
    reader.hidden = s==='idle';
    if(s!=='idle') msg.textContent='';
  }

  function finish(){
    token++; synth.cancel(); mark(-1);
    setState('idle');
    msg.textContent='最後まで読み終わりました。';
  }

  playBtn.addEventListener('click',function(){
    if(state==='playing'){ token++; synth.cancel(); setState('paused'); return; }
    if(state==='paused'){ speakFrom(idx); return; }
    var t=textEl.value;
    if(!t.trim()){ msg.textContent='先に文章を貼り付けてください。'; textEl.focus(); return; }
    sentences=split(t); buildReader(); speakFrom(0);
  });

  stopBtn.addEventListener('click',function(){
    token++; synth.cancel(); mark(-1); setState('idle'); msg.textContent='';
  });

  pasteBtn.addEventListener('click',function(){
    if(!navigator.clipboard || !navigator.clipboard.readText){
      msg.textContent='このブラウザではボタンから貼り付けできません。入力欄を長押し（右クリック）して貼り付けてください。';
      textEl.focus(); return;
    }
    navigator.clipboard.readText().then(function(t){
      if(!t){ msg.textContent='クリップボードが空です。先に文章をコピーしてください。'; return; }
      if(state!=='idle'){ token++; synth.cancel(); setState('idle'); }
      textEl.value=t; showCount(); store('yomi-text',t);
      msg.textContent='貼り付けました。「再生」で読み上げます。';
    }).catch(function(){
      msg.textContent='貼り付けが許可されませんでした。入力欄を長押し（右クリック）して貼り付けてください。';
      textEl.focus();
    });
  });

  clearBtn.addEventListener('click',function(){
    if(!textEl.value){ msg.textContent='消す文章がありません。'; return; }
    if(!confirm('入力した文章を全部消しますか？')) return;
    token++; if(synth) synth.cancel(); mark(-1); setState('idle');
    textEl.value=''; showCount(); store('yomi-text','');
    sentences=[]; reader.innerHTML='';
    msg.textContent='文章を消しました。';
    textEl.focus();
  });

  // 別のアプリに切り替えたり画面を消したりして声が止まったとき、戻ってきたら今の文から続きを読む
  document.addEventListener('visibilitychange',function(){
    if(document.hidden || state!=='playing' || !synth) return;
    try{ synth.resume(); }catch(e){}
    setTimeout(function(){
      if(state==='playing' && !synth.speaking && !synth.pending){ speakFrom(idx); }
    },400);
  });

  // ページを閉じるときは声も止める
  window.addEventListener('pagehide',function(){ if(synth) synth.cancel(); });
})();
</script>
</body>
</html>
